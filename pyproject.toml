[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pisama-agent-sdk"
version = "0.4.1"
description = "ATIF trace adapters and real-time failure hooks for agent runtimes (thin shim onto pisama.agents)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Pisama Team", email = "team@pisama.ai" }
]
keywords = ["claude", "agent", "sdk", "detection", "hooks", "pisama"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "pisama>=0.6.0",
]

[project.optional-dependencies]
# evaluator / telemetry stay declared, unchanged in content, purely for
# backward compatibility with anyone's existing `pip install
# pisama-agent-sdk[evaluator]` / `[telemetry]` / lockfile. They
# deliberately name the underlying third-party packages directly
# (httpx, posthog) rather than pointing at pisama's own `agents` /
# `telemetry` extras -- see CHANGELOG.md "Extras handling" for the
# reasoning (short version: pisama's `agents` extra is itself just
# `httpx`, so referencing `pisama[agents]` here would add a second,
# extra-name-coupled path to the same dependency for no benefit, and
# the base `dependencies` -> extras direction is exactly the edge the
# cycle rule below warns about). In practice `evaluator` is now a
# no-op: pisama>=0.6.0 already hard-depends on httpx>=0.27, so
# analyze_atif()/PisamaEvaluator work whether or not `[evaluator]` was
# requested. `telemetry` still gates real behavior: posthog stays an
# optional, try/imported dependency inside DetectionBridge.
evaluator = [
    "httpx>=0.24",
]
telemetry = [
    "posthog>=3.0",
]
dev = [
    "build>=1.5",
    "mypy>=1.8",
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.0",
    "httpx>=0.24",
    "ruff>=0.16,<1",
    "twine>=6.2",
]

[project.scripts]
# Phase C of plan-to-all-5-unified-glade.md: batch analysis of a
# completed OpenHands / Harbor-on-OpenHands session directory.
pisama-openhands-monitor = "pisama_agent_sdk.cli.openhands_monitor:main"

[project.urls]
Homepage = "https://pisama.ai"
Documentation = "https://github.com/Pisama-AI/pisama-agent-sdk#readme"
Repository = "https://github.com/Pisama-AI/pisama-agent-sdk"
Issues = "https://github.com/Pisama-AI/pisama-agent-sdk/issues"
Changelog = "https://github.com/Pisama-AI/pisama-agent-sdk/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/pisama_agent_sdk"]

[tool.hatch.build.targets.sdist]
include = [
    "CHANGELOG.md",
    "CODE_OF_CONDUCT.md",
    "CONTRIBUTING.md",
    "LICENSE",
    "README.md",
    "SECURITY.md",
    "src",
    "tests",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true

# No [[tool.mypy.overrides]] needed as of 0.4.0: this package no longer
# imports pisama_core, anthropic, or posthog directly (all moved to
# pisama.agents' own implementation). `pisama` ships a py.typed marker,
# so mypy resolves pisama.agents.* real types without an ignore.
