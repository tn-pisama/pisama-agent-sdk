name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          echo "tag_version=$TAG_VERSION pyproject=$PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag declares v$TAG_VERSION but pyproject.toml is $PKG_VERSION"
            exit 1
          fi
      - run: pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

  smoke:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        artifact: [wheel, sdist]
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - name: Select exact ${{ matrix.artifact }} artifact
        id: package
        shell: bash
        run: |
          shopt -s nullglob
          if [ "${{ matrix.artifact }}" = "wheel" ]; then
            packages=(dist/*.whl)
          else
            packages=(dist/*.tar.gz)
          fi
          test "${#packages[@]}" -eq 1
          echo "path=${packages[0]}" >> "$GITHUB_OUTPUT"
      - name: Install exact ${{ matrix.artifact }} artifact
        run: python -m pip install --quiet "${{ steps.package.outputs.path }}"
      - name: Smoke test installed artifact
        run: |
          EXPECTED_VERSION="${GITHUB_REF_NAME#v}" python - <<'PY'
          import os
          import pisama_agent_sdk
          from pisama_agent_sdk.atif import AtifAnalyzeResult, SUPPORTED_SCHEMA_VERSIONS

          assert pisama_agent_sdk.__version__ == os.environ["EXPECTED_VERSION"]
          assert "ATIF-v1.7" in SUPPORTED_SCHEMA_VERSIONS
          result = AtifAnalyzeResult.from_response({
              "trace": {
                  "trace_id": "release-smoke",
                  "span_count": 1,
                  "total_tokens": 3,
                  "atif_schema_version": "ATIF-v1.7",
                  "topology_complete": True,
              },
              "diagnosis": {
                  "detection_status": "complete",
                  "detectors_failed": {},
                  "all_detections": [],
              },
          })
          assert result.analysis_complete
          print(f"smoke OK: pisama-agent-sdk {pisama_agent_sdk.__version__}")
          PY

  publish:
    needs: [build, smoke]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      # Twine 7 supports the core metadata 2.5 emitted by current builders.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
